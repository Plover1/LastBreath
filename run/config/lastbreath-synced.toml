# Range: 1 ~ 16
ancientShrineGuardCount = 5
#Allow spirit deaths in ordinary Survival, including worlds with the legacy hardcoreOnly setting enabled.
enableSurvivalSpirits = true
#Controls new deaths only. Existing spirits can still be revived; admin commands remain available.
enableSpiritDeaths = true
enableSoulDrops = true
enableTalents = true
#Talent IDs 0-27. Disabling preserves learned progress and prevents activation and passive bonuses.
disabledTalents = []
enableTotemSelfRevival = true
enableAllyRevival = true
enableAltarRevival = true
enableMemoryTrials = true
#Affects generation in new chunks only; existing ruins are preserved.
generateMemoryRuins = true
