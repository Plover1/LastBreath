# Range: 0.1 ~ 100.0
gearUpgradeCostMultiplier = 1.0
# Default: 0.1
# Range: 0.0 ~ 1.0
gearHarvestExtraChance = 0.1
# Default: 5
# Range: 1 ~ 100
gearHarvestChargeCost = 5
# Default: 2.0
# Range: 0.0 ~ 20.0
gearHealHealth = 2.0
# Default: 10
# Range: 1 ~ 100
gearHealChargeCost = 10
# Default: 10
# Range: 1 ~ 600
gearHealCooldownSeconds = 10
# Default: 4.0
# Range: 1.0 ~ 100.0
gearGuardMinimumDamage = 4.0
